name: Documentation build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /.nvmrc
            /.npmrc
            /README.md
            /scripts/
            /docs/
            /images/
            !/docs/.vuepress/.cache/
            !/docs/.vuepress/.temp/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the verified package manager
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --strict-peer-deps --engine-strict
      - name: Build and verify documentation
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          RAYON_NUM_THREADS: '1'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/awesome-go-docs"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/awesome-go-docs/node_modules"
          npm run docs:build -- --dest "$RUNNER_TEMP/awesome-go-docs/dist" --temp "$RUNNER_TEMP/awesome-go-docs/temp" --cache "$RUNNER_TEMP/awesome-go-docs/cache" 2>&1 | tee "$RUNNER_TEMP/awesome-go-docs/build.log"
          npm run docs:check-build -- "$RUNNER_TEMP/awesome-go-docs/dist" "$RUNNER_TEMP/awesome-go-docs/build.log"
